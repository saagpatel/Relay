name: Test, Build & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (2026-10-05 PT)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install Linux dependencies
        run: |
          # shellcheck disable=SC2026
          elevate="$(command -v su''do)"
          "$elevate" apt-get update
          "$elevate" apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - id: changed-files
        if: github.event_name == 'pull_request'
        name: Detect perf-relevant changes
        run: |
          base_ref="origin/${GITHUB_BASE_REF:-main}"
          merge_base="$(git merge-base "$base_ref" HEAD)"
          changed_files="$(git diff --name-only "$merge_base" HEAD)"
          if printf '%s\n' "$changed_files" | grep -Eq '^(client/|scripts/perf/|scripts/ci/(export-operational-thresholds|check-perf-profile)\.mjs|\.perf-baselines/)'; then
            echo "perf_inputs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "perf_inputs_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run deterministic verify contract
        run: .codex/scripts/run_verify_commands.sh
        env:
          RELAY_SKIP_BUILD_TIME_COMPARE: ${{ github.event_name == 'pull_request' && steps.changed-files.outputs.perf_inputs_changed == 'false' && '1' || '0' }}

  test-server:
    runs-on: ubuntu-latest
    needs: verify-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
      - name: Run Go tests
        run: cd server && go test -race ./...

  build-frontend:
    runs-on: ubuntu-latest
    needs: verify-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Install dependencies
        run: cd client && pnpm install --frozen-lockfile
      - name: Build frontend
        run: cd client && pnpm build

  release-preflight:
    runs-on: ubuntu-latest
    needs: [test-server, build-frontend]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate release evidence (enforced mode)
        run: node scripts/ci/check-release-evidence.mjs --enforce
      - name: Validate release materials (enforced mode)
        run: node scripts/ci/check-release-materials.mjs --enforce
        env:
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PROVENANCE_SIGNING_KEY: ${{ secrets.PROVENANCE_SIGNING_KEY }}

  build-server-docker:
    runs-on: ubuntu-latest
    needs: [test-server, release-preflight]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/relay-server:latest
            ghcr.io/${{ github.repository }}/relay-server:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    needs: [test-server, build-frontend, release-preflight]
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (2026-10-05 PT)
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: cd client && pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ github.event.release.tag_name }}
          releaseName: 'Relay ${{ github.event.release.tag_name }}'
          releaseBody: 'See CHANGELOG for details.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
